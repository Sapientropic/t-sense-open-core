[project]
name = "t-sense"
version = "0.1.0"
description = "T-Sense local-first Telegram signal scanner and report generator."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [{ name = "Sapientropic" }]
dependencies = ["telethon==1.43.2"]

[project.optional-dependencies]
llm = ["openai==2.34.0"]
dev = ["pytest==9.0.3", "ruff==0.15.12"]

[project.urls]
Homepage = "https://github.com/Sapientropic/t-sense-open-core"
License = "https://github.com/Sapientropic/t-sense-open-core/blob/main/docs/licensing.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/scan.py" = ["E402"]
"scripts/ocr_media.py" = ["E402"]
